name: bundle

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - dist/**
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JesseTG/rm@v1.0.3
        with:
          path: dist

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - run: pnpm install && pnpm build
      - name: Only keep 角色卡示例 in dist for template upstream
        if: github.repository == 'StageDog/tavern_helper_template'
        run: |
          mv dist/角色卡示例 角色卡示例
          rm -rf dist
          mkdir dist
          mv 角色卡示例 dist/
      - name: Remove 示例 in dist for templated repository
        if: github.repository != 'StageDog/tavern_helper_template'
        run: |
          rm -rf dist/角色卡示例 dist/脚本示例 dist/流式楼层界面示例 dist/前端界面示例
      - name: Commit changes
        uses: EndBug/add-and-commit@v9.1.3
        with:
          default_author: github_actions
          message: '[bot] bundle'

      - name: Create immutable script release tag
        if: github.repository != 'StageDog/tavern_helper_template'
        env:
          MANIFEST_PATH: src/性斗学园/性斗学园脚本/update-manifest.json
          UPDATER_PATH: src/性斗学园/性斗学园脚本/scriptUpdater.ts
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).version" "$MANIFEST_PATH")"
          release_tag="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).releaseTag" "$MANIFEST_PATH")"
          script_version="$(sed -n "s/^export const SCRIPT_VERSION = '\([^']*\)';$/\1/p" "$UPDATER_PATH")"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$release_tag" != "v$version" ]] || [[ "$script_version" != "$version" ]]; then
            echo "性斗学园脚本版本、更新清单和发布标签必须完全一致。"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null; then
            echo "发布标签 $release_tag 已存在，跳过创建。"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$release_tag" -m "性斗学园脚本 $release_tag"
          git push origin "refs/tags/$release_tag"
